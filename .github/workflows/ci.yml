name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      CLAR_LOAD_DOTENV: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-server.txt
      - name: Check the release scanner with synthetic secrets
        run: python tools/check_release.py --self-test
      - name: Check release files for private material
        run: python tools/check_release.py
      - name: Build the portable extension
        run: python tools/build_extension.py
      - name: Backend, providers, benchmark metrics and production HTTP
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate editorial dataset
        run: python -m benchmarks validate
      - name: Validate benchmark matrix and execution plan without model calls
        run: python -m benchmarks run --matrix benchmarks/matrix.example.json --track both --modality all --dry-run --out .runtime/ci-benchmark-plan

  browser:
    name: Chromium regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLAR_LOAD_DOTENV: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: python tools/build_extension.py
      - name: JavaScript and isolated browser tests (mock APIs only)
        run: npm test

  container:
    name: Container build and fail-closed startup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker build --build-arg CLAR_BACKEND=https://clar.example.test --build-arg CLAR_EXTENSION_PROVIDER=local --tag clar:ci .
      - name: Public container requires initial invitation
        shell: bash
        run: |
          set -euo pipefail
          if timeout 20s docker run --rm clar:ci > /tmp/clar-startup.log 2>&1; then
            echo 'Public container unexpectedly started without an invitation.'
            exit 1
          fi
          grep -q 'Create a reviewer invitation' /tmp/clar-startup.log
      - name: Image runs as the application user
        run: test "$(docker run --rm clar:ci id -u)" = '10001'
      - name: Authenticated lifecycle and public extension packaging (mock model, no network)
        run: python3 tools/smoke_container.py --image clar:ci --backend https://clar.example.test
